spring:
    application:
        name: athlets-backend
    # TODO: Currently, we are using a generic account for dev. Once we deploy this, develop alternate application.yml's to fit environments
    datasource:
        url: jdbc:postgresql://localhost:5432/athlete_tracker
        username: dev_user
        password: dev_password
        # driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: none
        defer-datasource-initialization: true
    sql:
        init:
            mode: always
    docker:
        compose:
            enabled: true
            file: docker-compose.yml
    mail:
        host: smtp.gmail.com
        port: 587
        username: athlets.app@gmail.com
        password: MOT_DE_PASSE_APPLICATION_GOOGLE
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
app:
    frontend:
        base-url: http://localhost:5173
    mail:
        from: athlets.app@gmail.com
logging:
    level:
        org:
            springframework:
                jdbc:
                    datasource:
                        init: DEBUG
        com:
            centresportifets:
                athlets_backend:
                    auth: TRACE