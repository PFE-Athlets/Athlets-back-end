spring:
    application:
        name: athlets-backend
    # TODO: Currently, we are using a generic account for dev. Once we deploy this, develop alternate application.yml's to fit environments
    datasource:
        url: jdbc:postgresql://localhost:5432/athlete_tracker
        username: dev_user
        password: dev_password
        # driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: none
        defer-datasource-initialization: true
    sql:
        init:
            mode: always
    docker:
        compose:
            enabled: true
            file: docker-compose.yml
app:
    frontend:
        base-url: http://localhost:5173
    mail:
        enabled: ${MAIL_ENABLED:false}
        from: ${MAIL_FROM:pfe.athlets@etsmtl.ca}

        azure:
            tenant-id: ${AZURE_TENANT_ID:}
            client-id: ${AZURE_CLIENT_ID:}
            client-secret: ${AZURE_CLIENT_SECRET:}

        graph:
            base-url: https://graph.microsoft.com
            scope: https://graph.microsoft.com/.default
logging:
    level:
        org:
            springframework:
                jdbc:
                    datasource:
                        init: DEBUG
        com:
            centresportifets:
                athlets_backend:
                    auth: TRACE