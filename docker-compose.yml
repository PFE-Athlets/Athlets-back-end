  #   image: ${ACR_NAME:-local}.azurecr.io/athlete-backend:${ENV_TAG:-latest}
  #   ports:
  #     - "${APP_PORT:-8080}:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-athlete_tracker_dev}
  #     SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dev_user}
  #     SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
  #     SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
  #     SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
  #   depends_on:
  #     postgres-db:
  #       condition: service_healthy
  #   networks:
  #     - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge