name: Deploy Multi-Environment Backend

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B test

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    outputs:
      env: ${{ steps.set-env.outputs.env }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - id: set-env
      name: Determine environment from branch
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "env=prod" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "env=dev" >> $GITHUB_OUTPUT
          echo "image_tag=dev" >> $GITHUB_OUTPUT
        fi

    - name: Log in to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_NAME }}.azurecr.io
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build and Push Docker Image
      run: |
        FULL_IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/athlete-backend:${{ steps.set-env.outputs.image_tag }}"
        docker build -t $FULL_IMAGE .
        docker push $FULL_IMAGE

  deploy:
    name: Deploy on VM
    needs: build-and-push
    # Runs directly on the VM's own self-hosted runner - no SSH/SCP needed,
    # since the job's shell steps execute locally on that machine.
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENV: ${{ needs.build-and-push.outputs.env }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Per-environment config that docker-compose.yml reads via --env-file.
    # Pulled from the matching GitHub Environment (dev/prod).
    - name: Generate .env file
      run: |
        cat > .env <<EOF
        APP_NAME=athlete-${{ env.ENV }}
        ENV_TAG=${{ env.IMAGE_TAG }}
        ACR_NAME=${{ secrets.ACR_NAME }}
        APP_PORT=${{ vars.APP_PORT }}
        DB_PORT=${{ vars.DB_PORT }}
        POSTGRES_DB=${{ vars.POSTGRES_DB }}
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        SPRING_PROFILE=${{ env.ENV }}
        DDL_AUTO=${{ vars.DDL_AUTO }}
        EOF

    - name: Copy compose file to deploy directory
      run: |
        mkdir -p ~/app/${{ env.ENV }}
        cp docker-compose.yml .env ~/app/${{ env.ENV }}/

    - name: Log in to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_NAME }}.azurecr.io
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Pull and restart the stack
      run: |
        cd ~/app/${{ env.ENV }}
        docker compose pull
        docker compose --env-file .env up -d --remove-orphans